                <div class="nav-actions">
                    <button id="logoutBtn" class="btn-logout">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 19H5C4.46957 19 3.96086 18.7893 3.58579 18.4142C3.21071 18.0391 3 17.5304 3 17V7C3 6.46957 3.21071 5.96086 3.58579 5.58579C3.96086 5.21071 4.46957 5 5 5H12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Hero Section -->
    <section class="page-hero">
        <div class="container">
            <h1>Ofertas y destinos</h1>
            <p>Descubre nuestras mejores ofertas y destinos increíbles</p>
        </div>
    </section>

    <!-- Ofertas Section -->
    <section class="offers-intro">
        <div class="container">

            <h3 class="offers-title">
            Te llevamos a destinos desde
            <span id="originCityLabel">Bogotá</span>
            </h3>

            <div class="offers-filters">

            <select id="originSelector" class="offers-select"></select>

            <select id="countrySelector" class="offers-select">
                <option value="ALL">Ver todos</option>
            </select>

            </div>

        </div>
        <!-- GRID DE OFERTAS -->
        <section class="offers-section">
            <div class="container">
                <div class="offers-grid" id="offersGrid"></div>

        </section>
    </section>

    <footer class="main-footer">

    <script src="data_contentful.js"></script>
    <script src="script_ofertas.js"></script>
    <script>
        (function() {
            const hamburger = document.querySelector('.hamburger');
            const navMenu = document.querySelector('.nav-menu');
            if (!hamburger || !navMenu) return;
            hamburger.addEventListener('click', () => {
                navMenu.classList.toggle('mobile-active');
                hamburger.classList.toggle('active');
            });
            document.addEventListener('click', (e) => {
                if (!hamburger.contains(e.target) && !navMenu.contains(e.target)) {
                    navMenu.classList.remove('mobile-active');
                    hamburger.classList.remove('active');
                }
            });
        })();
    </script>
  <script src="analytics.js"></script>
