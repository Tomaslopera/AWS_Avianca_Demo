<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>avianca - Cargando...</title>
</head>
<body>
    <script>
        const COGNITO_DOMAIN = "https://us-east-1wai3cb0pm.auth.us-east-1.amazoncognito.com";
        const CLIENT_ID = "1vpm1sda0irgatmcvq9iseb9b8";
        const REDIRECT_URI = "https://d1cq6wgq3znilx.cloudfront.net";

        function generateRandomString(length) {
            const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            let result = "";
            const values = crypto.getRandomValues(new Uint8Array(length));
            values.forEach(v => result += charset[v % charset.length]);
            return result;
        }

        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            const hash = await crypto.subtle.digest("SHA-256", data);
            return btoa(String.fromCharCode(...new Uint8Array(hash)))
                .replace(/\+/g, "-")
                .replace(/\//g, "_")
                .replace(/=+$/, "");
        }

        async function redirectToLogin() {
            const codeVerifier = generateRandomString(64);
            const codeChallenge = await sha256(codeVerifier);
            localStorage.setItem("pkce_verifier", codeVerifier);

            const loginUrl = `${COGNITO_DOMAIN}/login` +
                `?client_id=${CLIENT_ID}` +
                `&response_type=code` +
                `&scope=openid+email+phone` +
                `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                `&code_challenge=${codeChallenge}` +
                `&code_challenge_method=S256`;

            window.location.href = loginUrl;
        }

        async function handleCallback() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get("code");
            if (!code) return false;

            const codeVerifier = localStorage.getItem("pkce_verifier");

            const response = await fetch(`${COGNITO_DOMAIN}/oauth2/token`, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                    grant_type: "authorization_code",
                    client_id: CLIENT_ID,
                    code: code,
                    redirect_uri: REDIRECT_URI,
                    code_verifier: codeVerifier
                })
            });

            const tokens = await response.json();

            if (!tokens.id_token) {
                console.error("Token exchange failed:", JSON.stringify(tokens));
                return false;
            }

            localStorage.setItem("idToken", tokens.id_token);
            localStorage.setItem("accessToken", tokens.access_token);
            localStorage.setItem("refreshToken", tokens.refresh_token);
            localStorage.removeItem("pkce_verifier");
            return true;
        }

        function isTokenValid() {
            const idToken = localStorage.getItem("idToken");
            if (!idToken) return false;
            try {
                const payload = JSON.parse(atob(idToken.split(".")[1]));
                return payload.exp * 1000 > Date.now();
            } catch (e) {
                return false;
            }
        }

        (async () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get("code");
            const error = params.get("error");

            if (code) {
                await handleCallback();
                window.location.href = "/home.html";
                return;
            }

            if (error) {
                window.history.replaceState({}, document.title, "/");
                return;
            }

            const idToken = localStorage.getItem("idToken");
            if (!idToken) {
                redirectToLogin();
            } else {
                window.location.href = "/home.html";
            }
        })();
    </script>
</body>
</html>
