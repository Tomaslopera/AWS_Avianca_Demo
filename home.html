<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>avianca - Encuentra tiquetes y vuelos baratos | Web oficial</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9V78277M5X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-9V78277M5X');
  </script>
</head>
<body>
    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="top-bar-container">
            <div class="top-bar-right">
                <!-- Contentful injects here -->
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="main-header">
        <nav class="navbar">
            <div class="nav-container">
                <a href="home.html" class="logo">
                    <svg width="120" height="32" viewBox="0 0 120 32" fill="none">
                        <text x="0" y="24" font-family="Inter" font-size="28" font-weight="700" fill="#E30613" style="letter-spacing: -0.5px;">avianca</text>
                    </svg>
                </a>
                
                <ul class="nav-menu">
                    <!-- Contentful injects here -->
                </ul>

                <div class="nav-actions">
                    <button id="logoutBtn" class="btn-logout">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 19H5C4.46957 19 3.96086 18.7893 3.58579 18.4142C3.21071 18.0391 3 17.5304 3 17V7C3 6.46957 3.21071 5.96086 3.58579 5.58579C3.96086 5.21071 4.46957 5 5 5H12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Cerrar sesión
                    </button>
                    <button class="hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- HERO — fondo viene de heroConfig en Contentful -->
    <section class="hero">
        <div class="hero-background">
            <div class="gradient-overlay"></div>
        </div>
        
        <div class="hero-content">
            <div class="search-widget">
                <div class="search-options">
                    <div class="trip-type">
                        <label class="radio-label">
                            <input type="radio" name="trip" value="round" checked>
                            <span class="radio-custom"></span>
                            <span>Ida y vuelta</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="trip" value="oneway">
                            <span class="radio-custom"></span>
                            <span>Solo ida</span>
                        </label>
                        <button class="btn-option">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 6v6l4 2"/>
                            </svg>
                            Comprar con millas
                        </button>
                        <label class="checkbox-label">
                            <input type="checkbox">
                            <span class="checkbox-custom"></span>
                            <span>Pagar con <strong>avianca credits</strong></span>
                        </label>
                    </div>
                    <div class="quick-links">
                        <a href="#" class="quick-link">
                            Hoteles
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
                            </svg>
                        </a>
                        <a href="#" class="quick-link">
                            Autos
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
                            </svg>
                        </a>
                    </div>
                </div>
                <form class="search-form">
                    <div class="form-row-main">
                        <div class="field-pair">
                            <div class="form-group">
                                <div class="input-with-icon">
                                    <input id="originInput" type="text" placeholder="Bogotá (BOG)">
                                </div>
                                <div class="city-dropdown" id="originDropdown">
                                    <div class="city-filter">
                                        <label><input type="radio" name="originFilter" value="all" checked> Todos</label>
                                        <label><input type="radio" name="originFilter" value="national"> Nacionales</label>
                                        <label><input type="radio" name="originFilter" value="international"> Internacionales</label>
                                    </div>
                                    <div class="city-list"></div>
                                </div>
                            </div>
                            <div class="divider"></div>
                            <div class="form-group">
                                <div class="input-with-icon">
                                    <input id="destinationInput" type="text" placeholder="Destino">
                                </div>
                                <div class="city-dropdown" id="destinationDropdown">
                                    <div class="city-filter">
                                        <label><input type="radio" name="destinationFilter" value="all" checked> Todos</label>
                                        <label><input type="radio" name="destinationFilter" value="national"> Nacionales</label>
                                        <label><input type="radio" name="destinationFilter" value="international"> Internacionales</label>
                                    </div>
                                    <div class="city-list"></div>
                                </div>
                            </div>
                        </div>
                        <div class="field-pair date-pair">
                            <div class="form-group">
                                <div class="input-with-icon">
                                    <input id="dateStart" type="text" placeholder="Ida">
                                </div>
                            </div>
                            <div class="divider"></div>
                            <div class="form-group">
                                <div class="input-with-icon">
                                    <div class="return-date">
                                        <input id="dateEnd" type="text" placeholder="Vuelta">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group passengers-group">
                            <div class="input-with-icon passengers-input" id="passengersToggle">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                    <circle cx="9" cy="7" r="4"/>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                                </svg>
                                <input id="passengersValue" type="text" value="1" readonly>
                                <svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </div>
                            <div id="passengersDropdown" class="passengers-dropdown">
                                <div class="row">
                                    <span>Adultos</span>
                                    <div class="counter">
                                        <button type="button" data-type="adult" data-op="-">-</button>
                                        <span id="adultCount">1</span>
                                        <button type="button" data-type="adult" data-op="+">+</button>
                                    </div>
                                </div>
                                <div class="row">
                                    <span>Niños</span>
                                    <div class="counter">
                                        <button type="button" data-type="child" data-op="-">-</button>
                                        <span id="childCount">0</span>
                                        <button type="button" data-type="child" data-op="+">+</button>
                                    </div>
                                </div>
                                <div class="row">
                                    <span>Bebés</span>
                                    <div class="counter">
                                        <button type="button" data-type="baby" data-op="-">-</button>
                                        <span id="babyCount">0</span>
                                        <button type="button" data-type="baby" data-op="+">+</button>
                                    </div>
                                </div>
                                <button type="button" class="confirm-passengers">Confirmar</button>
                            </div>
                        </div>
                        <button class="btn-buscar">Buscar</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- PROMOTIONAL BANNERS — contenido desde promoBanner en Contentful -->
    <section class="promo-banners">
        <div class="container">
            <div class="banner-grid">
                <!-- Populated by data_contentful.js -->
            </div>
        </div>
    </section>

    <!-- OFFERS SECTION — contenido desde destinations en Contentful -->
    <section class="offers-section">
        <div class="container">
            <div class="offers-header-index">
                <h3>Ofertas desde <span id="indexOriginLabel">Bogotá</span></h3>
                <select id="indexOriginSelector"></select>
            </div>
            <div class="offers-grid" id="indexOffersGrid"></div>
            <div style="margin-top: 30px;">
                <a href="ofertas.html" class="link-red">Descubrir más ofertas →</a>
            </div>
        </div>
    </section>

    <!-- PREPARE SECTION — contenido desde prepareCard en Contentful -->
    <section class="prepare-section">
        <div class="container">
            <h3 class="section-title">Prepárate para viajar</h3>
            <div class="prepare-grid">
                <!-- Populated by data_contentful.js -->
            </div>
        </div>
    </section>

    <!-- LIFEMILES NEWS SECTION — contenido desde lifemilesCard en Contentful -->
    <section class="lifemiles-news">
        <div class="container">
            <h3>Conoce las novedades de Lifemiles</h3>
            <div class="lifemiles-grid">
                <!-- Populated by data_contentful.js -->
            </div>
        </div>
    </section>

    <!-- INTEREST SECTION — contenido desde interestCard en Contentful -->
    <section class="interest-section">
        <div class="container">
            <h3>Más información de interés</h3>
            <div class="interest-grid">
                <!-- Populated by data_contentful.js -->
            </div>
        </div>
    </section>

    <!-- EXPERIENCE SECTION — contenido desde experienceCard en Contentful -->
    <section class="experience-section">
        <div class="container">
            <h3>Complementa tu experiencia</h3>
            <div class="experience-grid">
                <!-- Populated by data_contentful.js -->
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="main-footer">
        <div class="container">
            <div class="footer-top">
                <svg class="footer-logo" width="120" height="32" viewBox="0 0 120 32" fill="none">
                    <text x="0" y="24" font-family="Inter" font-size="28" font-weight="700" fill="currentColor" style="letter-spacing: -0.5px;">avianca</text>
                </svg>
            </div>
            <div class="footer-grid">
                <!-- Contentful injects here -->
            </div>
            <div class="footer-social">
                <!-- Contentful injects here -->
            </div>
            <div class="footer-bottom">
                <p>Copyright © Avianca 2026</p>
                <a href="#" class="powered-by">Powered by Newshore</a>
            </div>
        </div>
    </footer>

    <script src="data_contentful.js"></script>
    <script src="script.js"></script>
  <script src="analytics.js"></script>
</body>
</html>
