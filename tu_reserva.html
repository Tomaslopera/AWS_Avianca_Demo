<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu reserva - avianca</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="tu_reserva_styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- HEADER (igual que index) -->
    <header class="main-header">
        <nav class="navbar">
            <div class="nav-container">
                <a href="home.html" class="logo">
                    <svg width="120" height="32" viewBox="0 0 120 32" fill="none">
                        <text x="0" y="24" font-family="Inter" font-size="28" font-weight="700" fill="#E30613" style="letter-spacing: -0.5px;">Avianca</text>
                    </svg>
                </a>

                <ul class="nav-menu">
                    <li><a href="home.html" class="nav-link">Reservar</a></li>
                    <li class="nav-dropdown">
                        <a href="ofertas.html" class="nav-link">Ofertas y destinos</a>
                    </li>
                    <li class="nav-dropdown">
                        <a href="tu_reserva.html" class="nav-link">Tu reserva</a>
                    </li>
                    <li class="nav-dropdown">
                        <a href="#" class="nav-link">Información y ayuda</a>
                    </li>
                    <li><a href="#" class="nav-link">Lifemiles</a></li>
                </ul>

                <div class="nav-actions">
                    <button id="logoutBtn" class="btn-logout">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 19H5C4.46957 19 3.96086 18.7893 3.58579 18.4142C3.21071 18.0391 3 17.5304 3 17V7C3 6.46957 3.21071 5.96086 3.58579 5.58579C3.96086 5.21071 4.46957 5 5 5H12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Cerrar sesión
                    </button>
                    <button class="hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- HERO -->
    <section class="reservation-hero">
        <div class="container">
            <h1>Encuentra tu reserva</h1>
            <p>Ingresa tu código de reserva e identificación para consultar tu viaje</p>
        </div>
    </section>

    <!-- FORM SECTION -->
    <section class="reservation-section">
        <div class="container">

            <div class="reservation-card">

                <form id="reservationForm">

                    <div class="reservation-field">
                        <label>Código de reserva</label>
                        <input type="text" placeholder="Ej: ABC123" required>
                    </div>

                    <div class="reservation-field">
                        <label>Identificación</label>
                        <input type="text" placeholder="Ej: 123456789" required>
                    </div>

                    <button type="submit" class="reservation-btn">
                        Buscar reserva
                    </button>

                </form>

            </div>

        </div>
    </section>

    <!-- RESULTADO (placeholder futuro) -->
    <section class="reservation-result hidden" id="reservationResult">
        <div class="container">
            <div class="result-card">
                <h3>Reserva encontrada</h3>
                <p>Aquí se mostrará la información cuando conectemos la base de datos.</p>
            </div>
        </div>
    </section>

    <script src="script_tu_reserva.js"></script>
    <script>
        (function() {
            const hamburger = document.querySelector('.hamburger');
            const navMenu = document.querySelector('.nav-menu');
            if (!hamburger || !navMenu) return;
            hamburger.addEventListener('click', () => {
                navMenu.classList.toggle('mobile-active');
                hamburger.classList.toggle('active');
            });
            document.addEventListener('click', (e) => {
                if (!hamburger.contains(e.target) && !navMenu.contains(e.target)) {
                    navMenu.classList.remove('mobile-active');
                    hamburger.classList.remove('active');
                }
            });
        })();
    </script>

</body>
</html>
