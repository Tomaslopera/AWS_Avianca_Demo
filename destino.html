<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destino - avianca</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="destino.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Flatpickr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

</head>

<body>

    <div class="top-bar">
            <div class="top-bar-container">
                <div class="top-bar-right">
                    <a href="#" class="top-bar-link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M21 15C21 15.5304 20.7893 16.0391 20.4142 16.4142C20.0391 16.7893 19.5304 17 19 17H7L3 21V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Avianca Chat
                    </a>
                    <a href="#" class="top-bar-link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                            <path d="M12 2C14.5013 4.73835 15.9228 8.29203 16 12C15.9228 15.708 14.5013 19.2616 12 22M12 2C9.49872 4.73835 8.07725 8.29203 8 12C8.07725 15.708 9.49872 19.2616 12 22M2 12H22" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        Español
                    </a>
                    <a href="#" class="top-bar-link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21M16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Colombia (COP)
                    </a>
                </div>
            </div>
    </div>

    <!-- HEADER -->
    <header class="main-header">
        <nav class="navbar">
            <div class="nav-container">
                <a href="home.html" class="logo">
                    <svg width="120" height="32" viewBox="0 0 120 32" fill="none">
                        <text x="0" y="24" font-family="Inter" font-size="28" font-weight="700" fill="#E30613" style="letter-spacing: -0.5px;">avianca</text>
                    </svg>
                </a>
                
                <ul class="nav-menu">
                    <li><a href="home.html" class="nav-link">Reservar</a></li>
                    <li class="nav-dropdown">
                        <a href="ofertas.html" class="nav-link">Ofertas y destinos</a>
                    </li>
                    <li class="nav-dropdown">
                        <a href="tu_reserva.html" class="nav-link">Tu reserva</a>
                    </li>
                    <li class="nav-dropdown">
                        <a href="#" class="nav-link">Información y ayuda</a>
                    </li>
                    <li><a href="#" class="nav-link">Lifemiles</a></li>
                </ul>

                <div class="nav-actions">
                    <button id="logoutBtn" class="btn-logout">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 19H5C4.46957 19 3.96086 18.7893 3.58579 18.4142C3.21071 18.0391 3 17.5304 3 17V7C3 6.46957 3.21071 5.96086 3.58579 5.58579C3.96086 5.21071 4.46957 5 5 5H12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Cerrar sesión
                    </button>
                    <button class="hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- HERO EXACTAMENTE IGUAL AL INDEX -->
    <section class="hero city-destination-hero">

        <div class="hero-background">
            <div class="gradient-overlay"></div>
        </div>

            <div class="hero-content">

                <h1 class="destination-title" id="destinationTitle"></h1>

                <!-- FLIGHT SEARCH WIDGET -->
                <div class="search-widget">
                    <div class="search-options">
                        <div class="trip-type">
                            <label class="radio-label">
                                <input type="radio" name="trip" value="round" checked>
                                <span class="radio-custom"></span>
                                <span>Ida y vuelta</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="trip" value="oneway">
                                <span class="radio-custom"></span>
                                <span>Solo ida</span>
                            </label>
                            <button class="btn-option">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"/>
                                    <path d="M12 6v6l4 2"/>
                                </svg>
                                Comprar con millas
                            </button>
                            <label class="checkbox-label">
                                <input type="checkbox">
                                <span class="checkbox-custom"></span>
                                <span>Pagar con <strong>avianca credits</strong></span>
                            </label>
                        </div>

                        <div class="quick-links">
                            <a href="#" class="quick-link">
                                Hoteles
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
                                </svg>
                            </a>
                            <a href="#" class="quick-link">
                                Autos
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                    <form class="search-form">

                    <div class="form-row-main">

                        <!-- ORIGEN + DESTINO -->
                        <div class="field-pair">

                        <div class="form-group">
                            <div class="input-with-icon">
                                <input id="originInput" type="text" placeholder="Bogotá (BOG)">
                            </div>
                            <div class="city-dropdown" id="originDropdown">

                            <div class="city-filter">
                                <label>
                                <input type="radio" name="originFilter" value="all" checked>
                                Todos
                                </label>

                                <label>
                                <input type="radio" name="originFilter" value="national">
                                Nacionales
                                </label>

                                <label>
                                <input type="radio" name="originFilter" value="international">
                                Internacionales
                                </label>
                            </div>

                            <div class="city-list"></div>

                            </div>
                        </div>

                        <div class="divider"></div>

                        <div class="form-group">
                            <div class="input-with-icon">
                                <input id="destinationInput" type="text" placeholder="Destino">
                            </div>
                            <div class="city-dropdown" id="destinationDropdown">

                            <div class="city-filter">
                                <label>
                                <input type="radio" name="destinationFilter" value="all" checked>
                                Todos
                                </label>

                                <label>
                                <input type="radio" name="destinationFilter" value="national">
                                Nacionales
                                </label>

                                <label>
                                <input type="radio" name="destinationFilter" value="international">
                                Internacionales
                                </label>
                            </div>

                            <div class="city-list"></div>

                            </div>
                        </div>

                        </div>

                        <!-- FECHAS -->
                        <div class="field-pair date-pair">

                        <div class="form-group">
                            <div class="input-with-icon">
                            <input id="dateStart" type="text" placeholder="Ida">
                            </div>
                        </div>

                        <div class="divider"></div>

                        <div class="form-group">
                            <div class="input-with-icon">
                                <div class="return-date">
                                    <input id="dateEnd" type="text" placeholder="Vuelta">
                                </div>
                            </div>
                        </div>

                        </div>

                        <!-- PASAJEROS -->
                        <div class="form-group passengers-group">
                        <div 
                            class="input-with-icon passengers-input"
                            id="passengersToggle"
                        >
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>

                            <input 
                                id="passengersValue"
                                type="text"
                                value="1"
                                readonly
                            >

                            <svg class="dropdown-arrow" width="12" height="12"
                                viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </div>

                        <!-- DROPDOWN -->
                        <div id="passengersDropdown" class="passengers-dropdown">

                            <div class="row">
                            <span>Adultos</span>
                            <div class="counter">
                                <button type="button" data-type="adult" data-op="-">-</button>
                                <span id="adultCount">1</span>
                                <button type="button" data-type="adult" data-op="+">+</button>
                            </div>
                            </div>

                            <div class="row">
                            <span>Niños</span>
                            <div class="counter">
                                <button type="button" data-type="child" data-op="-">-</button>
                                <span id="childCount">0</span>
                                <button type="button" data-type="child" data-op="+">+</button>
                            </div>
                            </div>

                            <div class="row">
                            <span>Bebés</span>
                            <div class="counter">
                                <button type="button" data-type="baby" data-op="-">-</button>
                                <span id="babyCount">0</span>
                                <button type="button" data-type="baby" data-op="+">+</button>
                            </div>
                            </div>

                            <button  type="button" class="confirm-passengers">
                            Confirmar
                            </button>

                        </div>

                        </div>

                        <!-- BOTÓN -->
                        <button class="btn-buscar">Buscar</button>

                    </div>
                </form>
            </div>
            </div>
    </section>


    <!-- SECCIÓN LUGARES TURÍSTICOS -->
    <section class="tourism-section">
    <div class="container">
        <h2>Lugares que no te puedes perder</h2>
        <div class="tourism-grid" id="tourismGrid"></div>
    </div>
    </section>

    <script src="data_destinations.js"></script>
    <script src="script.js"></script>
    <script src="destino.js"></script>

</body>
</html>
